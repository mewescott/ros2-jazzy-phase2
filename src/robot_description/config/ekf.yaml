ekf_filter_node:
  ros__parameters:

    # Must be true in Gazebo simulation to keep timestamps aligned with /clock.
    use_sim_time: true

    # Gazebo already publishes odom -> base_link; avoid duplicate TF authorities.
    publish_tf: false

    # How often the filter should run, in Hz
    frequency: 30.0

    # Ignore Z, roll, and pitch - robot only moves in a 2D plane
    two_d_mode: true

    # First Odometry source
    odom0: /odom

    # Which fields of the odometry message should be used for the filter
    # Order x,      y,        z,
    #      roll,    pitch,    yaw,
    #      vx,      vy,       vz,
    #      vroll,   vpitch,   vyaw,
    #      ax,      ay,       az
    odom0_config: [true,    true,     false,   # fuse x, y position
                   false,   false,    true,    # fuse yaw (heading)
                   true,    true,     false,   # fuse vx, vy velocity
                   false,   false,    true,    # fuse vyaw (angular velocity)
                   false,   false,    false]   # ignore linear acceleration